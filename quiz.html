<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 10: JavaScript Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        .quiz-box {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2, h3 {
            margin-top: 0;
            color: #1a1a1a;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .options li {
            margin-bottom: 12px;
        }
        .options button {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .options button:hover {
            background: #f8f9fa;
            border-color: #adb5bd;
        }
        .options button.selected {
            background: #0056b3;
            color: #fff;
            border-color: #0056b3;
        }
        .action-btn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #218838;
        }
        .action-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .result-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .result-question {
            font-weight: bold;
            margin-bottom: 8px;
        }
        .correct-text { color: #28a745; font-weight: bold; }
        .wrong-text { color: #dc3545; font-weight: bold; }
        .score-display {
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="quiz-box" id="quiz-container">
        <!-- JavaScript will inject the quiz content here -->
    </div>

    <!-- Link to the JavaScript file -->
    <script src="quiz.js"></script>
</body>
</html>
